# CI: checks that run on every pull request and every push to main.
# Each job shows as a check on the pull request page: green to merge, red to fix.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install packages
        run: npm ci
      # Rules for the venue page's time slots (src/utils/slots.js), in Indianapolis time
      - name: Check time-slot rules
        run: TZ=America/Indianapolis node --test scripts/check-slots.mjs
      # Rules for the post/join celebrations (src/utils/celebration.js)
      - name: Check celebration rules
        run: node --test scripts/check-celebration.mjs
      # Helpers behind the My Games cards (src/utils/myGames.js)
      - name: Check My Games helpers
        run: TZ=America/Indianapolis node --test scripts/check-my-games.mjs
      # Day dividers, kickoff pills and initials in Messages and the game chat (src/utils/chat.js)
      - name: Check chat helpers
        run: TZ=America/Indianapolis node --test scripts/check-chat.mjs
      # Builds the JavaScript bundle the phone downloads. A typo, a missing import or
      # a file that doesn't exist fails here instead of on your phone.
      - name: Build iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios
      - name: Build Android bundle
        run: npx expo export --platform android --output-dir dist-android
      - name: Build web bundle
        run: npx expo export --platform web --output-dir dist-web

  python:
    name: Python tools (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: services/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      # The generated celebration sounds (scripts/make_sounds.py) are valid, short and not clipped
      - name: Check celebration sounds
        working-directory: .
        run: python -m unittest scripts/test_make_sounds.py -v

  database:
    name: Database migrations and security rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Uses the PostgreSQL that comes installed on GitHub's Ubuntu machines (turned off by
    # default) instead of a Docker image, so a Docker Hub outage can't fail the check.
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
          psql --version
      - name: Run migrations twice, then the tests
        run: bash supabase/tests/run.sh

  csharp:
    name: C# calendar feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/calendar-feed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      # The teams endpoint runs the C++ solver, so build it first for the end-to-end test
      - name: Build the C++ teams solver
        working-directory: services/teams-solver
        run: |
          cmake -S . -B build
          cmake --build build --target balance-teams
          echo "TEAMS_SOLVER_PATH=$PWD/build/balance-teams" >> "$GITHUB_ENV"
      - name: Build (warnings count as errors)
        run: dotnet build CalendarFeed.slnx -c Release
      - name: Run tests
        run: dotnet test CalendarFeed.slnx -c Release --no-build --logger "console;verbosity=normal"
      # The same package the deploy uploads to AWS Lambda, so packaging problems show up here first
      - name: Build the Lambda package
        run: dotnet publish src/CalendarFeed -c Release -r linux-arm64 --self-contained false -o publish

  cpp:
    name: C++ teams solver (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux with GCC, plus AddressSanitizer and UndefinedBehaviorSanitizer: they stop the
          # tests on memory mistakes (reading past the end of a vector, use after free) and on
          # undefined behavior that might otherwise "work" by luck.
          - name: Linux, GCC + sanitizers
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          # Windows with Visual Studio's compiler, the same one your PC would use
          - name: Windows, MSVC
            os: windows-latest
            configure: ""
    defaults:
      run:
        working-directory: services/teams-solver
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}
      - name: Build (warnings count as errors)
        run: cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Show a sample split
        run: ctest --test-dir build -C Release -R example-runs -V
      # The same arm64 build the AWS deploy ships, run through an emulator, so a problem
      # with it shows up on the pull request instead of during the deploy
      - name: Build for AWS Lambda (arm64) and run it
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user-static > /dev/null
          cmake -S . -B build-arm64 \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-arm64 --target balance-teams
          file build-arm64/balance-teams
          qemu-aarch64-static build-arm64/balance-teams examples/pickup.csv | tail -1 | grep "the best possible"
