# CD: puts the C# calendar feed and teams API online in AWS Lambda, with the C++ teams solver.
#
# Runs when calendar-feed code changes on main, or by hand (Actions > Deploy calendar feed >
# Run workflow). The first run creates the function and its public URL; later runs update it.
# The tests must pass before anything is deployed.
#
# One-time setup (infra/calendar-feed/README.md walks through it):
#   repository variables  AWS_REGION, AWS_DEPLOY_ROLE_ARN, AWS_LAMBDA_ROLE_ARN
#   fallback (optional)   secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY for the stack's deploy user;
#                         when both are set they're used instead of OIDC
#   repository secrets    SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (the same ones the scheduled tools use)
# Until the variables exist, the deploy skips itself instead of failing.

name: Deploy calendar feed

on:
  push:
    branches: [main]
    paths:
      - services/calendar-feed/**
      - services/teams-solver/src/**
      - services/teams-solver/include/**
      - services/teams-solver/CMakeLists.txt
      - .github/workflows/deploy-calendar-feed.yml
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub prove to AWS who it is, so no AWS keys are stored
  contents: read

concurrency:
  group: deploy-calendar-feed
  cancel-in-progress: false

env:
  FUNCTION_NAME: grassroots-calendar-feed

jobs:
  deploy:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Sign-in method: an access key if one is saved (fallback), otherwise OIDC
      USE_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Check the setup is done
        id: ready
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          LAMBDA_ROLE: ${{ vars.AWS_LAMBDA_ROLE_ARN }}
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if { [ -z "$ROLE" ] && [ "$USE_KEYS" != "true" ]; } || [ -z "$LAMBDA_ROLE" ] || [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::notice::Skipped: finish the one-time AWS setup in infra/calendar-feed/README.md to turn on deploys."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.ready.outputs.go == 'true'

      - uses: actions/setup-dotnet@v5
        if: steps.ready.outputs.go == 'true'
        with:
          dotnet-version: "10.0.x"

      # The tests run the real C++ teams solver, so build a copy for this machine first
      - name: Build the C++ teams solver for the tests
        if: steps.ready.outputs.go == 'true'
        working-directory: services/teams-solver
        run: |
          cmake -S . -B build
          cmake --build build --target balance-teams
          echo "TEAMS_SOLVER_PATH=$PWD/build/balance-teams" >> "$GITHUB_ENV"

      - name: Test
        if: steps.ready.outputs.go == 'true'
        working-directory: services/calendar-feed
        run: dotnet test CalendarFeed.slnx -c Release

      # The C++ teams solver, built for Lambda's arm64 processor on this x64 machine
      # (cross-compiling). -static puts everything it needs inside the one file, so it runs
      # on Lambda's Linux without depending on which C++ library version is installed there.
      - name: Build the C++ teams solver for arm64
        if: steps.ready.outputs.go == 'true'
        working-directory: services/teams-solver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user-static > /dev/null
          cmake -S . -B build-arm64 \
            -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-arm64 --target balance-teams
          file build-arm64/balance-teams
          # Run the arm64 program here through an emulator, to be sure it works before shipping it
          qemu-aarch64-static build-arm64/balance-teams examples/pickup.csv | tail -1

      # arm64 = AWS Graviton: about 20% cheaper than x86 for the same work
      - name: Build the Lambda package
        if: steps.ready.outputs.go == 'true'
        working-directory: services/calendar-feed
        run: |
          dotnet publish src/CalendarFeed -c Release -r linux-arm64 --self-contained false -o publish
          install -m 755 ../teams-solver/build-arm64/balance-teams publish/balance-teams
          cd publish && zip -qr ../function.zip . && cd ..
          ls -lh function.zip

      # Prints who GitHub says this run is (issuer, audience, subject), so a sign-in
      # problem with AWS can be matched against the role's trust rules. The token
      # itself is never printed.
      - name: Show the identity sent to AWS
        if: steps.ready.outputs.go == 'true' && env.USE_KEYS != 'true'
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(echo "$token" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          echo "$payload" | base64 -d | jq '{iss, aud, sub}'
          echo "Role:   [$ROLE]"
          echo "Region: [$REGION]"
          case "$ROLE" in
            arn:aws:iam::*:role/*) ;;
            *) echo "::error::AWS_DEPLOY_ROLE_ARN doesn't look like a role ARN. It should be one line starting arn:aws:iam::"; exit 1 ;;
          esac

      - name: Sign in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v5
        if: steps.ready.outputs.go == 'true' && env.USE_KEYS != 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sign in to AWS (deploy user access key)
        uses: aws-actions/configure-aws-credentials@v5
        if: steps.ready.outputs.go == 'true' && env.USE_KEYS == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create or update the function
        if: steps.ready.outputs.go == 'true'
        working-directory: services/calendar-feed
        env:
          LAMBDA_ROLE: ${{ vars.AWS_LAMBDA_ROLE_ARN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # Settings go in a file so the secret key never appears on a command line
          python3 - <<'PY' > env.json
          import json, os
          print(json.dumps({"Variables": {
              "SUPABASE_URL": os.environ["SUPABASE_URL"],
              "SUPABASE_SERVICE_ROLE_KEY": os.environ["SUPABASE_SERVICE_ROLE_KEY"],
          }}))
          PY

          if aws lambda get-function --function-name "$FUNCTION_NAME" > /dev/null 2>&1; then
            echo "Updating $FUNCTION_NAME"
            aws lambda update-function-code --function-name "$FUNCTION_NAME" \
              --zip-file fileb://function.zip --output text --query LastUpdateStatus
            aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
            aws lambda update-function-configuration --function-name "$FUNCTION_NAME" \
              --environment file://env.json --output text --query LastUpdateStatus
            aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          else
            echo "Creating $FUNCTION_NAME"
            aws lambda create-function --function-name "$FUNCTION_NAME" \
              --runtime dotnet10 --architectures arm64 \
              --handler CalendarFeed \
              --role "$LAMBDA_ROLE" \
              --memory-size 512 --timeout 20 \
              --environment file://env.json \
              --zip-file fileb://function.zip \
              --output text --query State
            aws lambda wait function-active-v2 --function-name "$FUNCTION_NAME"
          fi
          rm -f env.json

      - name: Make sure it has a public URL
        if: steps.ready.outputs.go == 'true'
        id: url
        run: |
          set -euo pipefail
          if ! aws lambda get-function-url-config --function-name "$FUNCTION_NAME" > /dev/null 2>&1; then
            aws lambda create-function-url-config --function-name "$FUNCTION_NAME" --auth-type NONE > /dev/null
            # Anyone with the URL may call it; the 64-character calendar link is what protects each feed
            aws lambda add-permission --function-name "$FUNCTION_NAME" \
              --statement-id public-url --action lambda:InvokeFunctionUrl \
              --principal "*" --function-url-auth-type NONE > /dev/null
            aws lambda add-permission --function-name "$FUNCTION_NAME" \
              --statement-id public-url-invoke --action lambda:InvokeFunction \
              --principal "*" --invoked-via-function-url > /dev/null \
              || echo "::warning::Couldn't add the second URL permission; if the URL answers 403, see infra/calendar-feed/README.md"
          fi
          url=$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" --query FunctionUrl --output text)
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - name: Check it answers
        if: steps.ready.outputs.go == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if [ "$(curl -s --max-time 20 "${{ steps.url.outputs.url }}/health")" = "ok" ]; then
              echo "Live: ${{ steps.url.outputs.url }}"
              {
                echo "### Calendar feed is live"
                echo
                echo "Base URL: \`${{ steps.url.outputs.url }}\`"
                echo
                echo "Put this in the app's \`.env\` as \`EXPO_PUBLIC_CALENDAR_FEED_URL\`."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Not answering yet, waiting..."; sleep 10
          done
          echo "::error::The function was deployed but /health didn't answer 'ok'. Check its logs in CloudWatch."
          exit 1
