# One-time AWS setup for the Grassroots calendar feed.
#
# Upload this file in the AWS console: CloudFormation > Create stack > With new resources >
# Upload a template file. It creates only permissions; the Lambda function itself is created
# by the GitHub Actions deploy workflow the first time it runs.
#
# What it makes:
#   LambdaRole   what the function itself may do: write its logs, nothing else
#   DeployRole   what GitHub Actions may do: update this one function, from the main branch
#                of this one repository, with no stored AWS keys (OpenID Connect)
#   LogGroup     the function's logs, kept 14 days so they don't pile up

AWSTemplateFormatVersion: "2010-09-09"
Description: Grassroots calendar feed - roles for Lambda and for GitHub Actions deploys

Parameters:
  GitHubRepo:
    Type: String
    Default: d0lawuyi/Grassroots
    Description: owner/repo allowed to deploy
  FunctionName:
    Type: String
    Default: grassroots-calendar-feed
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Choose false only if this AWS account already has token.actions.githubusercontent.com under IAM > Identity providers

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: 14

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Grassroots calendar feed function
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub ${LogGroup.Arn}:*

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: GitHub Actions deploys of the Grassroots calendar feed
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-calendar-feed-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ThisFunctionOnly
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunctionUrlConfig
                  - lambda:CreateFunctionUrlConfig
                  - lambda:GetPolicy
                  - lambda:AddPermission
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${FunctionName}
              - Sid: HandTheFunctionItsRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt LambdaRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  AwsRegion:
    Description: GitHub repository variable AWS_REGION
    Value: !Ref AWS::Region
  DeployRoleArn:
    Description: GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  LambdaRoleArn:
    Description: GitHub repository variable AWS_LAMBDA_ROLE_ARN
    Value: !GetAtt LambdaRole.Arn
